<head>

<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="description" content="OPIc 섀도잉 문장 297개, 기출 문제 423개, 주제별 표현 — 한 번만 내려받아 오프라인에서도 쓰는 학습 페이지">
<title>OPIc Study — 섀도잉 문장 · 기출 문제 · 표현</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/js/app.css?v=f8f45342">
<script>
  /* set the theme before first paint (no flash) */
  try {
    var s = JSON.parse(localStorage.getItem('opic.user.v2') || 'null');
    var t = (s && s.settings && s.settings.theme) || null;
    document.documentElement.setAttribute('data-theme',
      t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  } catch (e) {
    document.documentElement.setAttribute('data-theme',
      matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  }
</script>
</head>
<body>
<div id="app"></div>
